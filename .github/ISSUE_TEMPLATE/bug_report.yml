name: Bug report
description: Report a reproducible Catena bug.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail for someone else to reproduce it.
  - type: input
    id: version
    attributes:
      label: Catena version
      description: Run `catena version`.
      placeholder: "catena 0.3.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running Catena?
      options:
        - GitHub Release binary
        - Built from source
        - Docker
        - Docker Compose
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: "Windows 11 amd64, Ubuntu 24.04 amd64, macOS arm64"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include commands, request bodies, and schema/data needed to reproduce.
      placeholder: |
        1. Start Catena with ...
        2. Run ...
        3. Expected ...
        4. Actual ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or responses
      description: Paste relevant Catena logs, HTTP responses, or WebSocket messages.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Anything else that may help.
