name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Release Artifacts
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="catena-${version}-${GOOS}-${GOARCH}${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w" -o "${name}" .

      - name: Checksum
        run: |
          sha256sum catena-* > "SHA256SUMS-${{ matrix.goos }}-${{ matrix.goarch }}.txt"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: catena-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            catena-*
            SHA256SUMS-${{ matrix.goos }}-${{ matrix.goarch }}.txt

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create combined checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          rm -f dist/SHA256SUMS-*.txt
          (cd dist && sha256sum catena-${version}-* > SHA256SUMS.txt)

      - name: Prepare release notes
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "${notes}" ]; then
            cp "${notes}" RELEASE_NOTES.md
          else
            {
              echo "# Catena ${GITHUB_REF_NAME}"
              echo
              echo "Automated release artifacts for ${GITHUB_REF_NAME}."
            } > RELEASE_NOTES.md
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Catena ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/catena-*
            dist/SHA256SUMS.txt
